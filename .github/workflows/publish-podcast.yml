name: Publish daily podcast

on:
  push:
    branches:
      - main
    paths:
      - input/narration.txt

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-daily-podcast
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/Prague

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate MP3 and RSS feed
        run: |
          python scripts/generate_podcast.py

      - name: Replace previous podcast release
        shell: bash
        run: |
          set -euo pipefail

          EPISODE_FILE="$(
            find output \
              -maxdepth 1 \
              -type f \
              -name 'daily-news-*.mp3' \
              | head -n 1
          )"

          if [[ -z "$EPISODE_FILE" ]]; then
            echo "No generated MP3 found."
            exit 1
          fi

          gh release delete daily-podcast \
            --cleanup-tag \
            --yes || true

          sleep 2

          gh release create daily-podcast \
            "$EPISODE_FILE" \
            --target "$GITHUB_SHA" \
            --title "Martin's Daily News" \
            --notes "Latest automatically generated daily news briefing."

      - name: Commit updated RSS feed
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml

          if git diff --cached --quiet; then
            echo "No RSS changes to commit."
            exit 0
          fi

          git commit -m "Publish daily podcast RSS feed"
          git push