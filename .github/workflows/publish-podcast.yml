name: Publish daily podcast

on:
  push:
    branches:
      - claude/podcast-state
    paths:
      - input/narration.txt

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-daily-podcast
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: Europe/Prague

    steps:
      - name: Check out podcast branch
        uses: actions/checkout@v4
        with:
          ref: claude/podcast-state
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate MP3 and seven-episode RSS feed
        run: python scripts/generate_podcast.py

      - name: Create rolling podcast release if missing
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view daily-podcast >/dev/null 2>&1; then
            gh release create daily-podcast \
              --target claude/podcast-state \
              --title "Martin's Daily News" \
              --notes "Rolling release containing the latest seven podcast episodes."
          fi

      - name: Upload today's MP3
        shell: bash
        run: |
          set -euo pipefail

          EPISODE_FILE="$(
            find output \
              -maxdepth 1 \
              -type f \
              -name 'daily-news-*.mp3' \
              | sort \
              | tail -n 1
          )"

          if [[ -z "$EPISODE_FILE" ]]; then
            echo "No generated MP3 found."
            exit 1
          fi

          gh release upload daily-podcast "$EPISODE_FILE" --clobber

      - name: Keep only the latest seven MP3 assets
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ASSETS < <(
            gh release view daily-podcast \
              --json assets \
              --jq '.assets[].name' \
              | grep -E '^daily-news-[0-9]{4}-[0-9]{2}-[0-9]{2}\.mp3$' \
              | sort -r
          )

          if (( ${#ASSETS[@]} > 7 )); then
            for ASSET in "${ASSETS[@]:7}"; do
              echo "Deleting old podcast asset: $ASSET"
              gh release delete-asset daily-podcast "$ASSET" --yes
            done
          fi

      - name: Persist RSS episode history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/feed.xml docs/podcast-history.json

          if git diff --cached --quiet; then
            echo "No podcast metadata changes to commit."
          else
            git commit -m "Update seven-day podcast feed"
            git push origin HEAD:claude/podcast-state
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages content
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
